name: Release integrity

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean build, quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify LFS object integrity
        run: git lfs fsck

      - name: Install the locked dependency graph
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Block critical tooling vulnerabilities
        run: npm run audit:tooling

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify two reproducible clean release builds
        run: npm run verify:release

      - name: Run regression tests against the verified artifact
        run: npm run test:unit
